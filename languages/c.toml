# C, as Strike's universal compiler reads it.
#
# A pattern is the tokens of a form, in order:
#   $name   a name          $expr    an expression     $end   the end of a statement
#   $block  a block         $body    a block or one statement
#   $params a parameter list (to the closing parenthesis)
#   $args   expressions separated by commas (to the closing parenthesis)
#   $type   one or more type words        $simple  a statement without its end
#   $str    a string        @form    the form named so
#   [ a | b ]  one of a, b, or nothing
# Every other item is a token as written.

name = "C"
extensions = ["c", "h"]
line_comments = ["//"]
block_comments = [["/*", "*/"]]
string_quotes = ["\""]
char_quotes = ["'"]
blocks = "braces"
statement_end = ";"
scope = "block"
entry = "main"
param_name = "last"
type_words = ["int", "long", "short", "char", "void", "unsigned", "signed", "bool", "_Bool", "static", "extern", "const", "int64_t", "int32_t", "double", "float"]
chained_comparisons = "allow"
bool_print = []
# integers as clang makes them on Windows (x86-64): long is 32 bits there.
# Arithmetic is done at least as wide as int; a result is cut back to the
# width of where it goes, as C converts it. unsigned is refused, not
# guessed: it wraps and compares differently.
promote = 32
literals = "typed"
# {1, 2, 3} gives an array its first values; an index is not checked,
# as C does not check it
brace_lists = true
# floats: a double is 64 bits and a float 32 (1.5f is one); arithmetic with
# a whole number makes it a float, and (double)x converts. printf's %f, %e
# and %g print NaN and the infinities as the UCRT does. long double is
# refused.
float_suffixes = ["f", "F"]
casts = true
printf_floats = "ucrt"
# a string is chars ended by a zero byte: a literal is the address of its
# chars (read-only), a char array holds its own
strings = "c"

[float_widths]
double = 64
float = 32

[builtins]
strlen = "c_strlen"
strcmp = "c_strcmp"
sqrt = "sqrt"
fabs = "fabs"

# several files are translation units: a name outside a function is shared
# by every file unless it is static; a directory is every .c file in it
[program]
model = "units"
directory = "*.c"

# the preprocessor runs before C is cut into tokens (src/uc/cpp.rs). The
# macros clang defines itself come first; a header Strike knows gives what
# is written here: printf, puts, scanf, strlen, strcmp, sqrt and fabs are
# Strike's own (stdio.h's, string.h's and math.h's), and the macros
# are the values of clang's headers, written so Strike can read them. Any
# other header is refused.
[preprocessor]
marker = "#"
predefined = "c-predefined.h"

[preprocessor.headers]
"stdio.h" = """
#define EOF (-1)
"""
"string.h" = ""
"math.h" = ""
"stdlib.h" = """
#define EXIT_SUCCESS 0
#define EXIT_FAILURE 1
"""
"stdbool.h" = """
#define bool _Bool
#define true 1
#define false 0
#define __bool_true_false_are_defined 1
"""
"stdint.h" = """
#define INT8_MIN (-127 - 1)
#define INT8_MAX 127
#define INT16_MIN (-32767 - 1)
#define INT16_MAX 32767
#define INT32_MIN (-2147483647 - 1)
#define INT32_MAX 2147483647
#define INT64_MIN (-9223372036854775807 - 1)
#define INT64_MAX 9223372036854775807
"""
"limits.h" = """
#define CHAR_BIT 8
#define SCHAR_MIN (-127 -1)
#define SCHAR_MAX 127
#define CHAR_MIN (-127 -1)
#define CHAR_MAX 127
#define SHRT_MIN (-32767 -1)
#define SHRT_MAX 32767
#define INT_MIN (-2147483647 -1)
#define INT_MAX 2147483647
#define LONG_MIN (-2147483647 -1)
#define LONG_MAX 2147483647
#define LLONG_MIN (-9223372036854775807 -1)
#define LLONG_MAX 9223372036854775807
"""

[int_widths]
int = 32
long = 32
"long long" = 64
short = 16
char = 8
int64_t = 64
int32_t = 32
bool = 8
_Bool = 8

[bool_constants]
true = 1
false = 0

[binary]
"||" = [1, "or_bool"]
"&&" = [2, "and_bool"]
"|" = [3, "bor"]
"^" = [4, "bxor"]
"&" = [5, "band"]
"==" = [6, "eq"]
"!=" = [6, "ne"]
"<" = [7, "lt"]
"<=" = [7, "le"]
">" = [7, "gt"]
">=" = [7, "ge"]
"<<" = [8, "shl"]
">>" = [8, "shr"]
"+" = [9, "add"]
"-" = [9, "sub"]
"*" = [10, "mul"]
"/" = [10, "div_trunc"]
"%" = [10, "mod_trunc"]

[unary]
"-" = [11, "neg"]
"+" = [11, "plus"]
"!" = [11, "not"]
"~" = [11, "bnot"]

[[form]]
kind = "ignore"
place = "top"
pattern = "$type $name ( $params ) ;"

[[form]]
kind = "function"
place = "top"
pattern = "$type $name ( $params ) $block"

[[form]]
kind = "var"
place = "top"
pattern = "$type $name $dims [ = $expr ] ;"

[[form]]
kind = "read"
pattern = "scanf ( $str , & $name ) $end"

[[form]]
kind = "return"
pattern = "return [ $expr ] $end"

[[form]]
kind = "if"
pattern = "if ( $expr ) $body [ else $body ]"

[[form]]
kind = "while"
pattern = "while ( $expr ) $body"

[[form]]
kind = "for"
pattern = "for ( $simple ; $expr ; $simple ) $body"

[[form]]
kind = "break"
pattern = "break $end"

[[form]]
kind = "continue"
pattern = "continue $end"

[[form]]
kind = "print"
style = "format"
pattern = "printf ( $args ) $end"

[[form]]
kind = "print"
style = "line"
pattern = "puts ( $args ) $end"

[[form]]
kind = "var"
pattern = "$type $name $dims [ = $expr ] $end"

[[form]]
kind = "assign"
op = "add"
pattern = "$place += $expr $end"

[[form]]
kind = "assign"
op = "sub"
pattern = "$place -= $expr $end"

[[form]]
kind = "assign"
op = "mul"
pattern = "$place *= $expr $end"

[[form]]
kind = "assign"
op = "div_trunc"
pattern = "$place /= $expr $end"

[[form]]
kind = "assign"
op = "mod_trunc"
pattern = "$place %= $expr $end"

[[form]]
kind = "assign"
op = "add"
value = 1
pattern = "$place ++ $end"

[[form]]
kind = "assign"
op = "sub"
value = 1
pattern = "$place -- $end"

[[form]]
kind = "assign"
op = "add"
value = 1
pattern = "++ $place $end"

[[form]]
kind = "assign"
op = "sub"
value = 1
pattern = "-- $place $end"

[[form]]
kind = "assign"
pattern = "$place = $expr $end"

[[form]]
kind = "nothing"
pattern = ";"

[[form]]
kind = "expr"
pattern = "$expr $end"

# Python, as Strike's universal compiler reads it (the pattern items are
# explained in c.toml). Top-level statements are the program.

name = "Python"
extensions = ["py"]
line_comments = ["#"]
block_comments = []
skip_lines = []
string_quotes = ["\"", "'"]
char_quotes = []
blocks = "indent"
statement_end = "newline"
scope = "function"
entry = "toplevel"
param_name = "first"
type_words = ["int", "bool", "float"]
chained_comparisons = "error"
# Python's integers have no upper bound; Strike's are 64 bits, so where a
# number would not fit the program stops with an error, never wrapping
overflow = "error"
# int(input()): a line read from standard input as a whole number
read_line = ["int", "input"]
bool_print = ["True", "False"]
# lists: [a, b], [e for x in xs], a[-1] the last; an index out of range
# stops the program as Python's IndexError does
list_literals = true
comprehensions = true
negative_index = true
index_error = [1, "IndexError: list index out of range\n"]
list_print = ["[", ", ", "]"]
# floats: a double; a whole number meeting one is made one (compared
# exactly, though), / is true division, and a division by zero stops the
# program as ZeroDivisionError does. print shows a float by its repr.
float_print = "repr"
zero_division = [1, "ZeroDivisionError: division by zero\n"]

[float_widths]
float = 64

[qualified]
"math.sqrt" = "py_sqrt"

[builtins]
len = "len"
abs = "abs"

[methods]
append = "list_append"
pop = "list_pop"

[bool_constants]
True = 1
False = 0

[binary]
"or" = [1, "or_value"]
"and" = [2, "and_value"]
"==" = [4, "eq"]
"!=" = [4, "ne"]
"<" = [4, "lt"]
"<=" = [4, "le"]
">" = [4, "gt"]
">=" = [4, "ge"]
"|" = [5, "bor"]
"^" = [6, "bxor"]
"&" = [7, "band"]
"<<" = [8, "shl"]
">>" = [8, "shr"]
"+" = [9, "add"]
"-" = [9, "sub"]
"*" = [10, "mul"]
"/" = [10, "div_true"]
"//" = [10, "div_floor"]
"%" = [10, "mod_floor"]

[unary]
"not" = [3, "not"]
"-" = [11, "neg"]
"+" = [11, "plus"]
"~" = [11, "bnot"]

[[form]]
kind = "ignore"
place = "top"
pattern = "import $name $end"

[[form]]
kind = "function"
place = "top"
pattern = "def $name ( $params ) [ -> $type ] : $block"

[[form]]
kind = "if"
pattern = "if $expr : $block [ @elif | else : $block ]"

[[form]]
name = "elif"
kind = "if"
place = "sub"
pattern = "elif $expr : $block [ @elif | else : $block ]"

[[form]]
kind = "while"
pattern = "while $expr : $block"

[[form]]
kind = "for_range"
pattern = "for $name in range ( $args ) : $block"

[[form]]
kind = "for_each"
pattern = "for $name in $expr : $block"

[[form]]
kind = "return"
pattern = "return [ $expr ] $end"

[[form]]
kind = "break"
pattern = "break $end"

[[form]]
kind = "continue"
pattern = "continue $end"

[[form]]
kind = "nothing"
pattern = "pass $end"

[[form]]
kind = "global"
pattern = "global $name $end"

[[form]]
kind = "print"
style = "spaced_line"
pattern = "print ( $args ) $end"

[[form]]
kind = "assign"
op = "add"
pattern = "$place += $expr $end"

[[form]]
kind = "assign"
op = "sub"
pattern = "$place -= $expr $end"

[[form]]
kind = "assign"
op = "mul"
pattern = "$place *= $expr $end"

[[form]]
kind = "assign"
op = "div_true"
pattern = "$place /= $expr $end"

[[form]]
kind = "assign"
op = "div_floor"
pattern = "$place //= $expr $end"

[[form]]
kind = "assign"
op = "mod_floor"
pattern = "$place %= $expr $end"

[[form]]
kind = "assign"
pattern = "$place = $expr $end"

[[form]]
kind = "expr"
pattern = "$expr $end"

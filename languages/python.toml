# Python, as Strike's universal compiler reads it (the pattern items are
# explained in c.toml). Top-level statements are the program.

name = "Python"
extensions = ["py"]
line_comments = ["#"]
block_comments = []
string_quotes = ["\"", "'"]
char_quotes = []
blocks = "indent"
statement_end = "newline"
scope = "function"
entry = "toplevel"
param_name = "first"
type_words = ["int", "bool"]
chained_comparisons = "error"
# Python's integers have no upper bound; Strike's are 64 bits, so where a
# number would not fit the program stops with an error, never wrapping
overflow = "error"
# int(input()): a line read from standard input as a whole number
read_line = ["int", "input"]
bool_print = ["True", "False"]
# lists: [a, b], [e for x in xs], a[-1] the last; an index out of range
# stops the program as Python's IndexError does
list_literals = true
comprehensions = true
negative_index = true
index_error = [1, "IndexError: list index out of range\n"]
list_print = ["[", ", ", "]"]
# a string is code points; Strike holds them to ASCII (a literal past it is
# refused, a line read that holds one stops the program)
strings = "ascii"

# one file runs (a directory runs its __main__.py), and `import m` runs
# m.py next to it, once, where it is first imported. Python finds its own
# built-in and frozen modules before any file, so a file named like one is
# never imported: those names (sys.builtin_module_names and the frozen ones,
# Python 3.14) are refused as a file's name
[program]
model = "modules"
directory = "__main__.py"
found_first = ["_abc", "_ast", "_bisect", "_blake2", "_codecs", "_codecs_cn", "_codecs_hk", "_codecs_iso2022", "_codecs_jp", "_codecs_kr", "_codecs_tw", "_collections", "_collections_abc", "_contextvars", "_csv", "_datetime", "_frozen_importlib", "_frozen_importlib_external", "_functools", "_heapq", "_hmac", "_imp", "_interpchannels", "_interpqueues", "_interpreters", "_io", "_json", "_locale", "_lsprof", "_md5", "_multibytecodec", "_opcode", "_operator", "_pickle", "_random", "_sha1", "_sha2", "_sha3", "_signal", "_sitebuiltins", "_sre", "_stat", "_statistics", "_string", "_struct", "_suggestions", "_symtable", "_sysconfig", "_thread", "_tokenize", "_tracemalloc", "_types", "_typing", "_warnings", "_weakref", "_winapi", "abc", "array", "atexit", "binascii", "builtins", "cmath", "codecs", "errno", "faulthandler", "gc", "genericpath", "io", "itertools", "marshal", "math", "mmap", "msvcrt", "nt", "ntpath", "os", "posixpath", "runpy", "site", "stat", "sys", "time", "winreg", "xxsubtype", "zipimport", "zlib"]

[builtins]
len = "len"
str = "str"
ord = "ord"
chr = "chr"
input = "input"

[methods]
append = "list_append"
pop = "list_pop"
upper = "str_upper"
lower = "str_lower"
strip = "str_strip"
split = "str_split"
join = "str_join"
startswith = "str_startswith"
find = "str_find"

[bool_constants]
True = 1
False = 0

[binary]
"or" = [1, "or_value"]
"and" = [2, "and_value"]
"in" = [4, "in"]
"==" = [4, "eq"]
"!=" = [4, "ne"]
"<" = [4, "lt"]
"<=" = [4, "le"]
">" = [4, "gt"]
">=" = [4, "ge"]
"|" = [5, "bor"]
"^" = [6, "bxor"]
"&" = [7, "band"]
"<<" = [8, "shl"]
">>" = [8, "shr"]
"+" = [9, "add"]
"-" = [9, "sub"]
"*" = [10, "mul"]
"//" = [10, "div_floor"]
"%" = [10, "mod_floor"]

[unary]
"not" = [3, "not"]
"-" = [11, "neg"]
"+" = [11, "plus"]
"~" = [11, "bnot"]

[[form]]
kind = "function"
place = "top"
pattern = "def $name ( $params ) [ -> $type ] : $block"

[[form]]
name = "spec"
kind = "import"
place = "sub"
pattern = "$name [ as $name ]"

[[form]]
kind = "import"
pattern = "import @spec [ , @spec ]* $end"

[[form]]
kind = "import_from"
pattern = "from $name import * $end"

[[form]]
kind = "import_from"
pattern = "from $name import @spec [ , @spec ]* $end"

[[form]]
kind = "if"
pattern = "if $expr : $block [ @elif | else : $block ]"

[[form]]
name = "elif"
kind = "if"
place = "sub"
pattern = "elif $expr : $block [ @elif | else : $block ]"

[[form]]
kind = "while"
pattern = "while $expr : $block"

[[form]]
kind = "for_range"
pattern = "for $name in range ( $args ) : $block"

[[form]]
kind = "for_each"
pattern = "for $name in $expr : $block"

[[form]]
kind = "return"
pattern = "return [ $expr ] $end"

[[form]]
kind = "break"
pattern = "break $end"

[[form]]
kind = "continue"
pattern = "continue $end"

[[form]]
kind = "nothing"
pattern = "pass $end"

[[form]]
kind = "global"
pattern = "global $name $end"

[[form]]
kind = "print"
style = "spaced_line"
pattern = "print ( $args ) $end"

[[form]]
kind = "assign"
op = "add"
pattern = "$place += $expr $end"

[[form]]
kind = "assign"
op = "sub"
pattern = "$place -= $expr $end"

[[form]]
kind = "assign"
op = "mul"
pattern = "$place *= $expr $end"

[[form]]
kind = "assign"
op = "div_floor"
pattern = "$place //= $expr $end"

[[form]]
kind = "assign"
op = "mod_floor"
pattern = "$place %= $expr $end"

[[form]]
kind = "assign"
pattern = "$place = $expr $end"

[[form]]
kind = "expr"
pattern = "$expr $end"

[package]
name = "strike"
version = "0.1.0"
edition = "2021"
description = "A Rust build system that calls rustc itself: HotMotor chooses the build, lightning remembers it"
license = "MIT"
publish = false

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
blake3 = "1.8.7"
fastcdc = "5.0.0"
snow = "0.10.0"
